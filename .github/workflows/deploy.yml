name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # Se activará cada vez que subas código a la rama main

# Permisos necesarios para que GitHub Actions pueda publicar la web
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # Instala Vanilla JS, Vite y Sass en el servidor

      - name: Build
        run: npm run build # Compila tu Sass a CSS estático

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Sube la carpeta compilada por Vite

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
